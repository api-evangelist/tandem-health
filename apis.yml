aid: tandem-health
name: Tandem Health
description: >-
  Tandem Health is a European regulated clinical-AI company whose ambient
  assistant helps clinicians prepare, document, and follow up on patient visits.
  Its AI Scribe turns a consultation into a structured medical note, a Coding
  Assistant suggests diagnosis/procedure codes, and Clinical Decision Support
  (Ask Tandem) answers clinical questions during the visit with citations from
  NICE and national/local guidelines. The products are CE marked under EU MDR as
  Class IIa medical devices, support 50+ specialties, and are used by 5,000+ care
  organisations across Europe with one-click note transfer to 100+ medical record
  systems. Tandem Health is backed by Northzone. This API Evangelist profile
  tracks the company; Tandem Health publishes no public developer API.
